name: test-reporter
on:
  workflow_dispatch:
    inputs:
      suite:
        description: TestNG suite to run
        type: choice
        required: true
        default: smokeTest
        options:
          - smokeTest
          - groupATest
          - bundleATest
          - bundleBTest
          - bundleCTest
          - bundleDTest
          - browserstackTest

permissions:
  contents: read
  checks: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Validate suite selection
        env:
          TEST_SUITE: ${{ inputs.suite }}
        run: |
          case "$TEST_SUITE" in
            smokeTest|groupATest|bundleATest|bundleBTest|bundleCTest|bundleDTest|browserstackTest) ;;
            *)
              echo "::error::Unsupported TestNG suite: $TEST_SUITE"
              exit 1
              ;;
          esac
          test -f "src/test/testsuite/$TEST_SUITE.xml"

      - name: Run Maven tests
        env:
          TEST_SUITE: ${{ inputs.suite }}
        run: mvn clean test -DsuiteXmlFile="$GITHUB_WORKSPACE/src/test/testsuite/$TEST_SUITE.xml"

      - name: Upload test reports
        if: ${{ success() || failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/target/logs/*
            **/target/reports/*
          if-no-files-found: ignore

      - name: Upload Surefire reports
        if: ${{ success() || failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: surefire-test-reports
          path: '**/target/surefire-reports/**/*'
          if-no-files-found: ignore

      - name: Publish Test Report
        id: publish_report
        uses: dorny/test-reporter@v3
        if: ${{ success() || failure() }}
        with:
          name: Test Report
          reporter: java-junit
          only-summary: false
          list-suites: all
          list-tests: failed
          fail-on-error: false
          path: '**/target/surefire-reports/**/TEST-*.xml'

      - name: Write collector result
        id: write_result
        if: ${{ !cancelled() && steps.publish_report.outcome == 'success' }}
        env:
          TEST_SUITE: ${{ inputs.suite }}
          PASSED: ${{ steps.publish_report.outputs.passed }}
          FAILED: ${{ steps.publish_report.outputs.failed }}
          SKIPPED: ${{ steps.publish_report.outputs.skipped }}
          DURATION_MS: ${{ steps.publish_report.outputs.time }}
          OUTPUT_DIRECTORY: ${{ runner.temp }}/test-history-input
        run: node .github/scripts/write-test-result.mjs

      - name: Upload collector input
        if: ${{ !cancelled() && steps.write_result.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: test-history-input
          path: ${{ runner.temp }}/test-history-input/
          if-no-files-found: error
          retention-days: 7

      - name: Test Results Summary
        if: ${{ success() || failure() }}
        env:
          PASSED: ${{ steps.publish_report.outputs.passed }}
          FAILED: ${{ steps.publish_report.outputs.failed }}
          SKIPPED: ${{ steps.publish_report.outputs.skipped }}
          DURATION_MS: ${{ steps.publish_report.outputs.time }}
        run: |
          if ! [[ "$PASSED" =~ ^[0-9]+$ && "$FAILED" =~ ^[0-9]+$ && "$SKIPPED" =~ ^[0-9]+$ ]]; then
            echo "::error::The test reporter did not provide valid passed, failed, and skipped counts."
            exit 1
          fi
          total=$((PASSED + FAILED + SKIPPED))
          {
            echo "### Test Results Summary :rocket:"
            echo
            echo "Total: $total"
            echo ":heavy_check_mark: Passed: $PASSED"
            echo ":x: Failed: $FAILED"
            echo ":white_circle: Skipped: $SKIPPED"
            echo "Execution time (ms): ${DURATION_MS:-unknown}"
          } >> "$GITHUB_STEP_SUMMARY"
